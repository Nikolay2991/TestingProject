version: '3'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app:delegated       # Монтируем локальную папку в контейнер
      - /app/node_modules             # Исключаем node_modules
    ports:
      - "4000:4000"                   # Пробрасываем порт для backend
    environment:
      - NODE_ENV=development          # Переменная окружения для dev
      - MONGO_URI=mongodb://mongo:27017/mydb  # Строка подключения к MongoDB
    command: npm run start:dev      # Используем команду для разработки (с hot-reload)
    depends_on:
      - mongo                         # Обеспечиваем запуск MongoDB перед backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app:delegated     # Монтируем локальную папку для frontend
    ports:
      - "3000:3000"                   # Пробрасываем порт для frontend
    environment:
      - NODE_ENV=development
    command: npm start                # Запускаем frontend dev-сервер

  mongo:
    image: mongo:latest               # Используем официальный образ MongoDB
    container_name: mongo
    ports:
      - "27017:27017"                 # Пробрасываем порт для MongoDB
    volumes:
      - mongo-data:/data/db           # Монтируем volume для данных

volumes:
  mongo-data:                         # Named volume для данных MongoDB
